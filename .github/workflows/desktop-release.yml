name: Build desktop apps
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: ubuntu-22.04
            label: Linux-x64
          - os: ubuntu-24.04-arm
            label: Linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-tk libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev xvfb
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git make mingw-w64-x86_64-gcc
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash packaging/build_ffmpeg.sh
      - if: runner.os == 'Linux'
        run: bash packaging/build_ffmpeg.sh
      - run: python -m pip install pyinstaller==6.16.0 pygame==2.6.1 setuptools wheel
      - if: runner.os == 'Windows'
        run: python packaging/package_desktop.py
        env:
          CADENZA_PACKAGE: ${{ matrix.label }}
          SDL_AUDIODRIVER: dummy
      - if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/package_desktop.py
        env:
          CADENZA_PACKAGE: ${{ matrix.label }}
          SDL_AUDIODRIVER: dummy
      - if: runner.os == 'Windows'
        run: |
          choco install innosetup --yes --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging/windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Cadenza-${{ matrix.label }}
          path: build/Cadenza-${{ matrix.label }}*.zip
      - name: Publish desktop download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.4.0 "build/Cadenza-${{ matrix.label }}.zip" --clobber
          if [ -f build/Cadenza-Windows-x64-Setup.exe ]; then gh release upload v0.4.0 build/Cadenza-Windows-x64-Setup.exe --clobber; fi
